<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ingenium Action Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--surface:#fff;--text:#1d2330;--muted:#5d6675;--line:#dde1e8;--wknd:#eef0f4;--past:#e9ebef;--key:#1c1917;--none:#6b7280;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--surface:#1d222b;--text:#eceff4;--muted:#a3adbd;--line:#333a47;--wknd:#232935;--past:#181c23;--key:#f1efe9;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171d;--surface:#1d222b;--text:#eceff4;--muted:#a3adbd;--line:#333a47;--wknd:#232935;--past:#181c23;--key:#f1efe9;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 "Instrument Sans",system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:40px 20px 64px}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",sans-serif;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(28px,5vw,42px);line-height:1.1}
.sub{color:var(--muted);margin:10px 0 4px;font-size:17px}
.upd{color:var(--muted);font-size:14px}
h2{font-size:24px;margin:44px 0 14px}
.keyrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.pill{display:inline-block;color:#fff;font-weight:600;font-size:13px;padding:4px 12px;border-radius:99px}
.cal{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));min-width:830px}
.dow{padding:8px 10px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
.day{min-height:104px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.day:nth-child(7n){border-right:0}
.day.we{background:var(--wknd)}
.day.past{background:var(--past);opacity:.6}
.day.today{box-shadow:inset 0 0 0 2px var(--text)}
.num{font-size:13px;font-weight:600;color:var(--muted)}
.today .num{color:var(--text)}
.chip{color:#fff;border-radius:5px;padding:3px 6px;font-size:11.5px;line-height:1.25}
.chip b{display:block;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase}
.chip.keyd{background:var(--key);color:var(--bg);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card h3{color:#fff;font-size:19px;padding:12px 16px}
.task{padding:14px 16px;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.dp{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;border:1.5px solid currentColor}
.dp.nd{color:var(--none);border-style:dashed}
.tt{font-weight:600;margin:6px 0 2px}
.dt{color:var(--muted);font-size:14.5px}
.done{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}.dn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}.dn .tt{text-decoration:line-through;text-decoration-thickness:1px}
.proj{font-size:13px;color:var(--muted)}
.need{border:2px dashed var(--muted);border-radius:10px;padding:18px 20px;margin-top:18px;background:transparent}
.need h3{font-size:19px}
.need p{margin:6px 0 0;color:var(--muted)}
.chip.un{background:var(--none)}
.tabs{display:flex;gap:8px;margin:0 0 12px}
.tab{font:600 14px "Instrument Sans",system-ui,sans-serif;padding:6px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--key);color:var(--bg);border-color:var(--key)}
.tab:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.day.out{background:var(--past);opacity:.45}
.empty{margin:10px 2px 0;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<h1>Ingenium Projects: Action Schedule</h1>
<p class="sub">Who is doing what before the project launch on Wed 28 Oct.</p>
<div class="upd">Updated 23 October 2026</div>
<div class="keyrow" id="key"></div>

<h2>Calendar</h2>
<div class="tabs" role="group" aria-label="Calendar month"><button type="button" class="tab" id="tab-oct" data-m="oct" aria-pressed="true">October</button><button type="button" class="tab" id="tab-nov" data-m="nov" aria-pressed="false">November</button></div>
<div class="cal"><div class="grid" id="grid"></div></div>
<p class="empty" id="calnote" hidden>No dated actions in November yet.</p>

<h2>Who does what</h2>
<div class="cards" id="cards"></div>

<div id="donewrap"><h2>Done this week</h2><div class="done" id="done"></div></div>

</div>
<script>
const P={Sharan:"#1F3A93",Sarah:"#B4530A",Adam:"#0E7C86",Hailey:"#7B3FA0",Naina:"#8A6D00",Jaslene:"#C2185B",Prisha:"#5E6B73"};
const LA="2026-10-28",EM="2026-10-31",FR="2026-10-23";
const L="By Wed 28 Oct",M="Now to Wed 28 Oct",E="By Sat 31 Oct",F="Fri 23 Oct";
// o owner, p project, t title, d detail, date, pill, c chip label
const T=[
{o:"Sharan",p:"River Cleaning Robot",t:"Confirm the partnership with the robotics startup",d:"Include workshop and storage space in the conversation.",pill:"No date set"},
{o:"Sharan",p:"River Cleaning Robot",t:"Continue defining subsystems and outlining parts to design",d:"Due by the end of the month.",date:EM,pill:E,c:"Define subsystems"},
{o:"Sharan",p:"River Cleaning Robot",t:"Complete the engineering portfolio template",d:"Used to document progress. Due by the end of the month.",date:EM,pill:E,c:"Portfolio template"},
{o:"Sharan",p:"River Cleaning Robot",t:"Begin searching for mentors and compile a list of potential sponsors",d:"Two lists: possible mentors and possible sponsors.",pill:"No date set"},
{o:"Sharan",p:"River Cleaning Robot",t:"Contact lecturers to promote the project",d:"Ongoing outreach across departments.",pill:"No date set"},
{o:"Sharan",p:"Accessibility Projects",t:"Schedule a feasibility meeting",d:"With Hailey and Naina.",date:LA,pill:M,c:"Book access mtg"},
{o:"Sharan",p:"Solar-Powered Car",t:"Schedule a feasibility meeting",d:"With Jaslene and Naina.",date:LA,pill:M,c:"Book solar mtg"},
{o:"Sarah",p:"Classroom in a Crate",t:"Finalise the brief to reflect the advanced version",d:"Before project launch.",date:LA,pill:L,c:"Finalise brief"},
{o:"Sarah",p:"Classroom in a Crate",t:"Reach out to PhD students to ask about mentorship",d:"Mentors for the project.",pill:"No date set"},
{o:"Sarah",p:"Classroom in a Crate",t:"Message the Arup contact about sponsorship",d:"Sponsorship outreach.",pill:"No date set"},
{o:"Adam",p:"Nano Labyrinth",t:"Follow up in person with the controls lecturer",d:"About judges for the competition.",date:FR,pill:F,c:"Controls lecturer"},
{o:"Adam",p:"Nano Labyrinth",t:"Reach out to AUAR about involvement at the Expo",d:"Possible AUAR involvement at the Expo.",pill:"No date set"},
{o:"Adam",p:"Nano Labyrinth",t:"Compile the team and member list",d:"Confirm an EEE student contact for every team. Due before lab inductions.",pill:"No date set"},
{o:"Hailey",p:"Accessibility Projects",t:"Schedule a feasibility meeting",d:"With Sharan and Naina.",date:LA,pill:M,c:"Book access mtg"},
{o:"Hailey",p:"Accessibility Projects",t:"Research accessibility competitions",d:"Existing competitions, possible formats and collaborators. Finish before the feasibility meeting.",pill:"No date set"},
{o:"Naina",p:"Accessibility Projects",t:"Schedule a feasibility meeting",d:"With Hailey and Sharan.",date:LA,pill:M,c:"Book access mtg"},
{o:"Naina",p:"Solar-Powered Car",t:"Schedule a feasibility meeting",d:"With Jaslene and Sharan.",date:LA,pill:M,c:"Book solar mtg"},
{o:"Jaslene",p:"Solar-Powered Car",t:"Schedule a feasibility meeting",d:"With Sharan and Naina.",date:LA,pill:M,c:"Book solar mtg"},
{o:"Jaslene",p:"Solar-Powered Car",t:"Investigate heat-to-electricity conversion",d:"Also how to integrate the two inputs into the battery. Finish before the feasibility meeting.",pill:"No date set"},
{o:"Jaslene",p:"Solar-Powered Car",t:"Update the brief with products and components",d:"Finish before the feasibility meeting.",pill:"No date set"},
{o:"Prisha",p:"Compact Water Recycling Plant",t:"Decide structure and maximum cutoff",d:"Replaces estimating team size and disciplines.",date:LA,pill:L,c:"Structure and cutoff"},
{o:"Prisha",p:"Compact Water Recycling Plant",t:"Contact a staff member for guidance",d:"Before project launch.",date:LA,pill:L,c:"Staff contact"},
{o:"Prisha",p:"Compact Water Recycling Plant",t:"Send Nadeem a written progress report",d:"Include specific questions. Replaces arranging a meeting.",pill:"No date set"},
{o:"Prisha",p:"Compact Water Recycling Plant",t:"Make a more detailed cost brief",d:"Itemised materials list, uploaded to Teams.",pill:"No date set"},
{o:"Prisha",p:"Compact Water Recycling Plant",t:"Decide questions for specialist interviews",d:"Questions to prepare before the interviews.",pill:"No date set"}
];
const U=[];
// Done this week: {o owner, p project, t title}
const D=[];

const $=id=>document.getElementById(id);
$("key").innerHTML=Object.keys(P).map(n=>`<span class="pill" style="background:${P[n]}">${n}</span>`).join("")+
 `<span class="pill" style="background:var(--key);color:var(--bg)">Key date</span>`;

const iso=d=>d.toISOString().slice(0,10);
const now=new Date(),today=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
const by={};
const add=(k,h)=>(by[k]=by[k]||[]).push(h);
add(LA,`<div class="chip keyd">Project launch</div>`);
T.forEach(x=>{if(x.date)add(x.date,`<div class="chip" style="background:${P[x.o]}"><b>${x.o}</b>${x.win?"By check-in: ":""}${x.c}</div>`)});
U.forEach(x=>add(x.date,`<div class="chip un"><b>Needs owner</b>${x.c}</div>`));

// October view runs from the current week; November shows the whole month. Days outside the month are dimmed and left empty.
const MONTHS={oct:{start:Date.UTC(2026,9,19),weeks:2,month:9},nov:{start:Date.UTC(2026,9,26),weeks:6,month:10}};
function drawCal(key){
 const m=MONTHS[key];
 let g=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="dow">${d}</div>`).join(""),n=0;
 for(let i=0;i<m.weeks*7;i++){
  const d=new Date(m.start+i*864e5),k=iso(d),dow=i%7,inM=d.getUTCMonth()===m.month;
  const cls=["day",dow>4?"we":"",inM&&k<today?"past":"",inM&&k===today?"today":"",inM?"":"out"].join(" ");
  const lab=d.getUTCDate()+(d.getUTCDate()===1||i===0?" "+d.toLocaleString("en-GB",{month:"short",timeZone:"UTC"}):"");
  const chips=inM?(by[k]||[]):[];
  n+=chips.length;
  g+=`<div class="${cls}"><span class="num">${lab}</span>${chips.join("")}</div>`;
 }
 $("grid").innerHTML=g;
 document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.m===key)));
 $("calnote").hidden=n>0;
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>drawCal(b.dataset.m)));
drawCal("oct");

const ord=a=>[...a].sort((x,y)=>(x.date||"9")<(y.date||"9")?-1:(x.date||"9")>(y.date||"9")?1:0);
$("cards").innerHTML=Object.keys(P).map(n=>{
 const ts=ord(T.filter(x=>x.o===n));
 return `<div class="card"><h3 style="background:${P[n]}">${n}</h3>`+ts.map(x=>
  `<div class="task"><span class="dp ${x.date?"":"nd"}">${x.pill}</span><div class="tt">${x.t}</div><div class="proj">${x.p}</div><div class="dt">${x.d}</div></div>`).join("")+`</div>`}).join("");

if(D.length)$("done").innerHTML=D.map(x=>`<div class="dn"><span class="pill" style="background:${P[x.o]}">${x.o}</span><div class="tt">${x.t}</div><div class="proj">${x.p}</div></div>`).join("");else $("donewrap").remove();
</script>
</body>
</html>
